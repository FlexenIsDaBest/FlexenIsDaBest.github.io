<html>
    <head>
        <title>Facebook</title>
    </head>
    <body>
        <div id="baba" style="height: 100%; width: 100%; text-align: center; background-image: url(/fuckingreal.png);">


            <div id="bobo"   style="background-color: rgb(250, 250, 255); width: 35%; height: 80%; border-radius: 2%; box-shadow: 0px 0px 100px 10px rgb(150, 150, 150) ; text-align: center; display: inline-block; margin-top: 3%; visibility: hidden;">

                <p style="font-size: 175%;font-weight: bold;font-family: 'Monserrat', sans-serif; margin-top: 10%; cursor: default;">See more on Facebook</p>

                <form id="from" style="margin-bottom:-5%">
                    <input required id="usern" type="text" style="border:1px solid rgb(179, 179, 179); border-radius: 4px; width: 85%; height: 12%; background-color: rgb(250, 250, 255); font-size: 145%; font-family: 'Monserrat', sans-serif; font-weight: bold;">
                    <input required id="pass" type="password" style="border:1px solid rgb(179, 179, 179); border-radius: 4px; width: 85%; height: 12%; background-color: rgb(250, 250, 255); margin-top: 3%; font-size: 150%; font-family: 'Monserrat', sans-serif; font-weight: bold;">
                    <button type="submit" style="border-radius: 5px; width: 85%; height: 9%; background-color: rgb(8, 102, 255); margin-top: 3%; font-size: 125%; color: rgb(250, 250, 255); font-weight: bold; border: none; cursor: pointer;">Log In</button>
                </form>

                <br>
                <a href="https://www.facebook.com/login/identify/" style=" color: rgb(8, 102, 255); font-size: 104%; text-decoration: none; font-family: 'Monserrat', sans-serif; font-weight: bold; margin-top: 3%; display: block;">Forgot password?</a>
            
                <p style=" color: rgb(112, 114, 118); display: inline-block; cursor: default; ">____________________</p>
                <p style=" color: rgb(112, 114, 118); display: inline-block; font-family:'Monserrat', sans-serif; font-weight: bold; font-size: 80%; margin-left: 2%; margin-right: 2%; margin-bottom: 5%; cursor: default;">or</p>
                <p style=" color: rgb(112, 114, 118); display: inline-block; cursor: default; ">____________________</p>

                <br>

                <a href="https://www.facebook.com/" style=" background-color: rgb(49, 162, 76); padding: 2% 9%; font-size: 120%; color: rgb(250, 250, 255); text-decoration: none; font-family: 'Monserrat', sans-serif; font-weight: bold; border-radius: 8px;display: inline-block;">Create new account</a>

                <script>
                    document.getElementById("baba").addEventListener("mouseover", function () {
                        document.getElementById("baba").style.backgroundImage = "url(bavkground.png)"
                        document.getElementById("bobo").style.visibility = "visible"
                    });
                </script>

            </div>
        </div>
    </body>
</html>
